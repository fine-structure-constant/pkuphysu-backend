PORT = 8080
JWT_SECRET = "your-jwt-secret-key"
TOKEN_EXPIRE = 60

[storage]
BASE_DIR = "./data/static/files"

[database]
HOST = "localhost"
PORT = 5432
USER = "your_db_user"
PASSWORD = "your_db_password"
NAME = "your_db_name"
SSL_MODE = "disable"
TABLE_PREFIX = "pkuphysu_"

[cors]
ALLOW_ORIGINS = ["http://localhost", "http://localhost:5173", "http://127.0.0.1:5173","http://127.0.0.1:4321","http://localhost:4321"]
ALLOW_METHODS = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
ALLOW_HEADERS = ["Origin", "Content-Type", "Accept", "Authorization"]

[log_config]
ENABLE = true
LEVEL = "info"
MAX_SIZE = 100
MAX_AGE = 30
MAX_BACKUPS = 7
COMPRESS = false
FILE_PATH = "./data/log/log.log"

[email]
HOST = "smtp.example.com"
PORT = 587
USERNAME = "your-email@example.com"
PASSWORD = "your-email-password"
FROM = "your-email@example.com"

[rate_limit]
REQUESTS_PER_SECOND = 10
BURST = 20
BLOCK_DURATION = 300
